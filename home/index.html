<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Createx - Online Courses</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="wrapper1">
      <div class="container">
        <header class="header">
          <a href="index.html"><img src="./img/logo.svg" alt="CREATEX" /></a>
          <nav class="nav">
            <a class="text" href="index.html#about">About Us</a>
            <a class="text" href="courses.html">Courses</a>
            <a class="text" href="index.html#events">Events</a>
            <a class="text" href="#">Blog</a>
            <a class="text" href="#">Contacts</a>
          </nav>
          <div class="header_right">
            <button class="btn btn_primary">Get consultation</button>
            <a class="text login" href="#">
              <i class="fa-regular fa-user"></i>
              Log in / Register
            </a>
          </div>
        </header>
        <section class="hero">
          <div class="hero_content">
            <a href="#" class="showreel">
              <span class="showreel_icon"
                ><i class="fa-solid fa-play"></i
              ></span>
              <span class="showreel_text">Play showreel</span>
            </a>
            <h1 class="hero_title">
              Enjoy studying with Createx Online Courses
            </h1>
            <div class="hero_buttons">
              <a href="#about" class="btn btn_outline">About us</a>
              <a href="courses.html" class="btn btn_primary">Explore courses</a>
            </div>
          </div>
          <img
            class="hero_img"
            src="./img/illustration.svg"
            alt="Student studying online with a tutor"
          />
        </section>
        <section class="stats">
          <div class="stat">
            <span class="stat_number">1200</span>
            <span class="stat_text">Students graduated</span>
          </div>
          <span class="dot"></span>
          <div class="stat">
            <span class="stat_number">84</span>
            <span class="stat_text">Completed courses</span>
          </div>
          <span class="dot"></span>
          <div class="stat">
            <span class="stat_number">16</span>
            <span class="stat_text">Qualified tutors</span>
          </div>
          <span class="dot"></span>
          <div class="stat">
            <span class="stat_number">5</span>
            <span class="stat_text">Years of experience</span>
          </div>
        </section>
      </div>
    </div>
    <section class="wrapper2">
      <img src="./img/image.svg" alt="" />
    </section>
  </body>
</html>
